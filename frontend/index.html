<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Insurance QA Pipeline</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    [v-cloak] { display: none; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    #sidebar {
      position: fixed;
      top: 49px; /* header height */
      left: 0;
      width: 11rem; /* w-44 */
      bottom: 0;
      overflow-y: auto;
      z-index: 10;
    }
    #main-content {
      margin-left: 11rem;
      margin-top: 49px;
      height: calc(100vh - 49px);
      overflow-y: auto;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 text-sm">

<div id="app" v-cloak>
  <!-- Header -->
  <header class="bg-white border-b px-6 py-3 flex items-center justify-between sticky top-0 z-20 shadow-sm">
    <div class="flex items-center gap-3">
      <span class="text-blue-600 font-bold text-base">⚡ Insurance QA Pipeline</span>
    </div>
    <div class="flex items-center gap-2 text-xs text-gray-500">
      <span v-if="pipelineStatus.is_running"
            class="inline-block w-3 h-3 border-2 border-blue-400 border-t-transparent rounded-full animate-spin"></span>
      <span v-else class="inline-block w-2.5 h-2.5 rounded-full bg-green-400"></span>
      {{ pipelineStatus.is_running ? '运行中…' : '就绪' }}
    </div>
  </header>

  <!-- Sidebar: position fixed, always visible -->
  <nav id="sidebar" class="bg-white border-r pt-4 px-2 flex flex-col gap-0.5">
    <button v-for="item in navItems" :key="item.key"
            @click="currentPage = item.key"
            :class="['w-full text-left px-3 py-2 rounded-lg font-medium transition-colors',
                     currentPage === item.key
                       ? 'bg-blue-50 text-blue-700'
                       : 'text-gray-600 hover:bg-gray-100']">
      <span class="mr-1.5">{{ item.icon }}</span>{{ item.label }}
    </button>
  </nav>

  <!-- Main: scrollable, offset by sidebar width -->
  <main id="main-content" class="p-6">
    <component :is="pages[currentPage]" :pipeline-status="pipelineStatus" />
  </main>
</div>

<script>
const { createApp, ref, reactive, onMounted, onUnmounted, nextTick, computed, watch } = Vue;

// ─── Page: Documents ──────────────────────────────────────────────────────────
const PageDocuments = {
  template: `
    <div>
      <h2 class="text-base font-semibold mb-4">文档管理</h2>

      <div @dragover.prevent @drop.prevent="onDrop"
           @click="$refs.fi.click()"
           class="border-2 border-dashed border-blue-200 rounded-xl p-10 text-center cursor-pointer hover:bg-blue-50 hover:border-blue-400 transition mb-5">
        <div class="text-3xl mb-2">📄</div>
        <p class="text-blue-500 font-medium">点击或拖拽文件上传</p>
        <p class="text-gray-400 text-xs mt-1">支持 PDF / DOCX / TXT / MD</p>
        <input ref="fi" type="file" multiple accept=".pdf,.docx,.doc,.txt,.md" class="hidden" @change="onSelect" />
      </div>

      <div v-if="uploading" class="mb-3 flex items-center gap-2 text-blue-500 text-xs">
        <span class="w-3 h-3 border-2 border-blue-400 border-t-transparent rounded-full animate-spin"></span>
        上传中…
      </div>

      <div class="text-xs text-gray-400 mb-3">共 {{ result.total.toLocaleString() }} 个文件</div>

      <div v-if="result.items.length" class="bg-white border rounded-xl overflow-hidden mb-4">
        <table class="w-full">
          <thead class="bg-gray-50 text-gray-500 text-xs border-b">
            <tr>
              <th class="text-left px-4 py-2 font-medium">文件名</th>
              <th class="text-left px-4 py-2 font-medium w-24">大小</th>
              <th class="px-4 py-2 w-16"></th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="f in result.items" :key="f.relative_path" class="border-b last:border-0 hover:bg-gray-50">
              <td class="px-4 py-2.5 text-gray-700">{{ f.name }}</td>
              <td class="px-4 py-2.5 text-gray-400 text-xs">{{ fmtSize(f.size) }}</td>
              <td class="px-4 py-2.5 text-center">
                <button @click.stop="del(f.relative_path)"
                        class="text-red-300 hover:text-red-500 transition text-xs">删除</button>
              </td>
            </tr>
          </tbody>
        </table>

        <!-- Pagination -->
        <div class="flex items-center gap-2 px-4 py-3 border-t text-xs flex-wrap">
          <button @click="load(1)" :disabled="result.page<=1"
                  class="px-2 py-1.5 border rounded disabled:opacity-30 hover:bg-gray-50 transition">«</button>
          <button @click="load(result.page-1)" :disabled="result.page<=1"
                  class="px-3 py-1.5 border rounded disabled:opacity-30 hover:bg-gray-50 transition">‹ 上一页</button>
          <span class="text-gray-500">
            第 <input type="number" v-model.number="jumpPage" @keyup.enter="goPage(jumpPage)"
                      class="w-12 border rounded px-1 py-0.5 text-center text-xs" :min="1" :max="result.pages" />
            / {{ result.pages }} 页
          </span>
          <button @click="load(result.page+1)" :disabled="result.page>=result.pages"
                  class="px-3 py-1.5 border rounded disabled:opacity-30 hover:bg-gray-50 transition">下一页 ›</button>
          <button @click="load(result.pages)" :disabled="result.page>=result.pages"
                  class="px-2 py-1.5 border rounded disabled:opacity-30 hover:bg-gray-50 transition">»</button>
        </div>
      </div>
      <p v-else class="text-gray-400 text-xs">暂无文档，请上传文件</p>

      <button v-if="result.total" @click="startPreprocess"
              class="mt-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-medium">
        开始预处理 →
      </button>
    </div>
  `,
  setup() {
    const result = reactive({ items: [], total: 0, page: 1, pages: 1 });
    const uploading = ref(false);
    const jumpPage = ref(1);

    async function load(page = 1) {
      const n = Math.max(1, Math.min(page, result.pages || 1));
      const r = await fetch('/api/documents/?page=' + n + '&size=50');
      const d = await r.json();
      result.items = d.items;
      result.total = d.total;
      result.page  = d.page;
      result.pages = d.pages;
      jumpPage.value = d.page;
    }

    async function upload(list) {
      uploading.value = true;
      for (const f of list) {
        const form = new FormData();
        form.append('file', f);
        await fetch('/api/documents/upload', { method: 'POST', body: form });
      }
      uploading.value = false;
      load(1);
    }

    function goPage(p) { load(p); }
    function onDrop(e) { upload(e.dataTransfer.files); }
    function onSelect(e) { upload(e.target.files); }

    async function del(path) {
      if (!confirm('确认删除？')) return;
      await fetch('/api/documents/' + path, { method: 'DELETE' });
      load(Math.min(result.page, result.pages));
    }

    async function startPreprocess() {
      await fetch('/api/pipeline/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ step: 'preprocess' }),
      });
      alert('预处理已启动，请前往「流水线」页面查看进度');
    }

    function fmtSize(b) {
      if (b < 1024) return b + ' B';
      if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
      return (b / 1048576).toFixed(1) + ' MB';
    }

    onMounted(() => load(1));
    return { result, uploading, jumpPage, onDrop, onSelect, del, startPreprocess, fmtSize, load, goPage };
  },
};

// ─── Page: Pipeline ───────────────────────────────────────────────────────────
const PagePipeline = {
  props: ['pipelineStatus'],
  template: `
    <div>
      <h2 class="text-base font-semibold mb-5">流水线控制</h2>

      <!-- Step cards -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div v-for="(step, key) in localStatus.steps" :key="key"
             class="bg-white border rounded-xl p-4 shadow-sm">
          <div class="flex items-center gap-2 mb-2">
            <span :class="dotClass(step.status)"></span>
            <span class="font-medium">{{ step.label }}</span>
          </div>
          <div class="text-xs text-gray-400 mb-2">{{ statusText(step.status) }}</div>
          <div v-if="step.status === 'running'" class="h-1 rounded bg-gray-100 overflow-hidden">
            <div class="h-1 bg-blue-500 rounded transition-all duration-500"
                 :style="{ width: (step.progress || 0) + '%' }"></div>
          </div>
          <div v-if="step.status === 'running' && step.progress > 0"
               class="text-xs text-blue-500 mt-1">{{ step.progress }}%</div>
          <div v-if="step.output_count" class="text-xs text-green-600 mt-1">
            输出 {{ step.output_count.toLocaleString() }} 条
          </div>
          <div v-if="step.error" class="text-xs text-red-400 mt-1 truncate" :title="step.error">
            {{ step.error }}
          </div>
        </div>
      </div>

      <!-- Control buttons -->
      <div class="flex flex-wrap gap-2 mb-5 items-center">
        <template v-if="localStatus.is_running">
          <button @click="stop"
                  class="px-4 py-1.5 bg-red-500 text-white rounded-lg hover:bg-red-600 transition font-medium flex items-center gap-1.5">
            <span>⏹</span> 停止
          </button>
          <span class="text-xs text-red-400">当前步骤完成后将停止</span>
        </template>
        <template v-else>
          <button @click="start('all')"
                  class="px-4 py-1.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-medium">
            ▶ 全流程
          </button>
          <button v-for="s in ['preprocess','seed','seed_dedup','expand','qc']" :key="s"
                  @click="start(s)"
                  :class="['px-3 py-1.5 border rounded-lg transition',
                           s === 'seed_dedup'
                             ? 'bg-teal-50 border-teal-300 text-teal-700 hover:bg-teal-100'
                             : 'bg-white border-gray-300 text-gray-600 hover:bg-gray-50']">
            {{ stepLabel(s) }}
          </button>
        </template>
      </div>

      <!-- Log console -->
      <div class="bg-gray-900 rounded-xl px-4 py-3 font-mono text-xs text-green-300 h-64 overflow-y-auto" ref="logEl">
        <div v-if="!logs.length" class="text-gray-600">等待日志输出…</div>
        <div v-for="(line, i) in logs" :key="i"
             :class="line.level === 'ERROR' ? 'text-red-400' : line.level === 'WARNING' ? 'text-yellow-300' : ''">
          {{ line.message }}
        </div>
      </div>
    </div>
  `,
  setup(props) {
    const logs = ref([]);
    const logEl = ref(null);
    const localStatus = reactive({ is_running: false, steps: {} });
    let es = null;

    function syncStatus(state) {
      if (state) Object.assign(localStatus, state);
    }

    function connect() {
      if (es) es.close();
      es = new EventSource('/api/pipeline/events');
      es.onmessage = (e) => {
        const ev = JSON.parse(e.data);
        if (ev.type === 'init') syncStatus(ev.state);
        else if (ev.type === 'step_update') {
          if (localStatus.steps[ev.step]) Object.assign(localStatus.steps[ev.step], ev);
        } else if (ev.type === 'pipeline_done') {
          syncStatus(ev.state);
        } else if (ev.type === 'log') {
          logs.value.push(ev);
          if (logs.value.length > 300) logs.value.shift();
          nextTick(() => { if (logEl.value) logEl.value.scrollTop = logEl.value.scrollHeight; });
        }
      };
      es.onerror = () => setTimeout(connect, 3000);
    }

    watch(() => props.pipelineStatus, (v) => syncStatus(v), { deep: true });

    async function start(step) {
      logs.value = [];
      const r = await fetch('/api/pipeline/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ step }),
      });
      if (!r.ok) {
        const d = await r.json();
        alert(d.detail || '启动失败');
      }
    }

    function dotClass(s) {
      return {
        idle:    'w-2 h-2 rounded-full bg-gray-300',
        running: 'w-2 h-2 rounded-full bg-blue-500 animate-pulse',
        done:    'w-2 h-2 rounded-full bg-green-500',
        error:   'w-2 h-2 rounded-full bg-red-500',
        stopped: 'w-2 h-2 rounded-full bg-yellow-500',
      }[s] || 'w-2 h-2 rounded-full bg-gray-300';
    }
    function statusText(s) {
      return { idle: '待运行', running: '运行中…', done: '已完成', error: '出错', stopped: '已停止' }[s] || s;
    }
    function stepLabel(s) {
      return { preprocess: '预处理', seed: '种子生成', seed_dedup: '种子去重', expand: '批量扩展', qc: '质检' }[s] || s;
    }

    async function stop() {
      const r = await fetch('/api/pipeline/stop', { method: 'POST' });
      if (!r.ok) {
        const d = await r.json();
        alert(d.detail || '停止失败');
      }
    }

    onMounted(connect);
    onUnmounted(() => { if (es) es.close(); });
    return { logs, logEl, localStatus, start, stop, dotClass, statusText, stepLabel };
  },
};

// ─── Page: Chunks ─────────────────────────────────────────────────────────────
const PageChunks = {
  template: `
    <div>
      <h2 class="text-base font-semibold mb-4">文档 Chunks</h2>

      <div class="flex flex-wrap gap-2 mb-4">
        <select v-model="f.doc_type" @change="load(1)" class="border rounded px-2 py-1.5 text-xs">
          <option value="">文档类型: 全部</option>
          <option v-for="t in opts.doc_types" :key="t" :value="t">{{ t }}</option>
        </select>
        <select v-model="f.insurance_type" @change="load(1)" class="border rounded px-2 py-1.5 text-xs">
          <option value="">险种: 全部</option>
          <option v-for="t in opts.ins_types" :key="t" :value="t">{{ t }}</option>
        </select>
        <input v-model="search" @keyup.enter="load(1)" placeholder="搜索内容…"
               class="border rounded px-3 py-1.5 text-xs flex-1 min-w-40" />
        <button @click="load(1)" class="px-3 py-1.5 bg-blue-600 text-white rounded text-xs hover:bg-blue-700 transition">搜索</button>
      </div>

      <div class="text-xs text-gray-400 mb-3">共 {{ result.total.toLocaleString() }} 条</div>

      <div v-if="loading" class="text-center py-10 text-gray-400">加载中…</div>

      <div v-else class="space-y-2">
        <div v-for="(c, i) in result.items" :key="c.chunk_id || i"
             @click="expanded = expanded === i ? null : i"
             class="bg-white border rounded-lg p-3 cursor-pointer hover:border-blue-300 transition">
          <div class="flex justify-between items-start mb-1">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="text-gray-400 font-mono text-xs">{{ c.chunk_id }}</span>
              <span class="px-1.5 py-0.5 bg-blue-50 text-blue-600 rounded text-xs">{{ c.doc_type }}</span>
              <span v-if="c.insurance_type && c.insurance_type !== '通用'"
                    class="px-1.5 py-0.5 bg-green-50 text-green-600 rounded text-xs">{{ c.insurance_type }}</span>
              <span v-if="c.section_title" class="text-gray-400 text-xs">{{ c.section_title }}</span>
            </div>
            <span class="text-gray-300 text-xs whitespace-nowrap ml-2">{{ c.char_count }} 字</span>
          </div>
          <p class="text-gray-600 text-xs line-clamp-2">{{ c.text }}</p>
          <div v-if="expanded === i" class="mt-3 text-xs text-gray-700 whitespace-pre-wrap border-t pt-3 leading-relaxed">{{ c.text }}</div>
        </div>
        <div v-if="!result.items.length" class="text-center py-10 text-gray-400">无数据</div>
      </div>

      <!-- Pagination -->
      <div class="flex items-center gap-2 mt-4 text-xs flex-wrap">
        <button @click="load(1)" :disabled="result.page<=1"
                class="px-2 py-1.5 border rounded disabled:opacity-30 hover:bg-gray-50 transition">«</button>
        <button @click="load(result.page-1)" :disabled="result.page<=1"
                class="px-3 py-1.5 border rounded disabled:opacity-30 hover:bg-gray-50 transition">‹ 上一页</button>
        <span class="text-gray-500">
          第 <input type="number" v-model.number="jumpPage" @keyup.enter="goPage(jumpPage)"
                    class="w-12 border rounded px-1 py-0.5 text-center text-xs" :min="1" :max="result.pages" />
          / {{ result.pages }} 页
        </span>
        <button @click="load(result.page+1)" :disabled="result.page>=result.pages"
                class="px-3 py-1.5 border rounded disabled:opacity-30 hover:bg-gray-50 transition">下一页 ›</button>
        <button @click="load(result.pages)" :disabled="result.page>=result.pages"
                class="px-2 py-1.5 border rounded disabled:opacity-30 hover:bg-gray-50 transition">»</button>
      </div>
    </div>
  `,
  setup() {
    const f = reactive({ doc_type: '', insurance_type: '' });
    const search = ref('');
    const expanded = ref(null);
    const loading = ref(false);
    const result = reactive({ items: [], total: 0, page: 1, pages: 1 });
    const opts = reactive({ doc_types: [], ins_types: [] });
    const jumpPage = ref(1);

    async function load(page = 1) {
      const n = Math.max(1, Math.min(page, result.pages || 1));
      loading.value = true; expanded.value = null;
      const p = new URLSearchParams({ page: n, size: 20, doc_type: f.doc_type, insurance_type: f.insurance_type, search: search.value });
      const r = await fetch('/api/data/chunks?' + p);
      Object.assign(result, await r.json());
      jumpPage.value = result.page;
      if (!opts.doc_types.length && result.items.length) {
        opts.doc_types = [...new Set(result.items.map(c => c.doc_type).filter(Boolean))];
        opts.ins_types = [...new Set(result.items.map(c => c.insurance_type).filter(Boolean))];
      }
      loading.value = false;
    }

    function goPage(p) { load(p); }

    onMounted(() => load(1));
    return { f, search, expanded, loading, result, opts, load, jumpPage, goPage };
  },
};

// ─── Page: Q&A Browser ────────────────────────────────────────────────────────
const PageQA = {
  template: `
    <div>
      <h2 class="text-base font-semibold mb-4">Q&A 浏览器</h2>

      <!-- Filters -->
      <div class="bg-white border rounded-xl p-4 mb-4 flex flex-wrap gap-3 items-end">
        <div v-for="(opts, key) in filterOpts" :key="key" class="flex flex-col gap-1">
          <label class="text-xs text-gray-400">{{ filterLabel(key) }}</label>
          <select v-model="filters[key]" @change="loadPage(1)"
                  class="border rounded px-2 py-1.5 text-xs min-w-28 bg-white">
            <option value="">全部</option>
            <option v-for="o in opts" :key="o" :value="o">{{ o }}</option>
          </select>
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-xs text-gray-400">状态</label>
          <select v-model="filters.status" @change="loadPage(1)"
                  class="border rounded px-2 py-1.5 text-xs bg-white">
            <option value="passed">质检通过</option>
            <option value="rejected">质检拒绝</option>
          </select>
        </div>
        <div class="flex flex-col gap-1 flex-1 min-w-40">
          <label class="text-xs text-gray-400">搜索问题</label>
          <input v-model="searchText" @keyup.enter="loadPage(1)" type="text"
                 placeholder="输入关键词后回车…" class="border rounded px-3 py-1.5 text-xs" />
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-xs text-gray-400">每页</label>
          <select v-model.number="pageSize" @change="loadPage(1)"
                  class="border rounded px-2 py-1.5 text-xs bg-white">
            <option :value="20">20</option>
            <option :value="50">50</option>
            <option :value="100">100</option>
          </select>
        </div>
        <button @click="reset" class="text-xs text-gray-400 hover:text-gray-600 underline self-end pb-1.5">重置</button>
      </div>

      <!-- Count -->
      <div class="flex justify-between items-center mb-2">
        <span class="text-xs text-gray-400">
          共 <strong class="text-gray-700">{{ result.total.toLocaleString() }}</strong> 条 &nbsp;·&nbsp;
          显示第 {{ ((result.page-1)*result.size+1).toLocaleString() }}–{{ Math.min(result.page*result.size, result.total).toLocaleString() }} 条
        </span>
      </div>

      <!-- Table -->
      <div class="bg-white border rounded-xl overflow-hidden mb-3">
        <table class="w-full">
          <thead class="bg-gray-50 text-gray-400 text-xs border-b">
            <tr>
              <th class="text-left px-4 py-2 font-medium">问题</th>
              <th class="text-left px-4 py-2 font-medium w-24">险种</th>
              <th class="text-left px-4 py-2 font-medium w-16">难度</th>
              <th class="text-left px-4 py-2 font-medium w-24 hidden md:table-cell">类型</th>
              <th class="text-left px-4 py-2 font-medium w-20 hidden md:table-cell">来源</th>
            </tr>
          </thead>
          <tbody>
            <template v-for="(item, i) in result.items" :key="item.id || i">
              <tr @click="toggle(i)"
                  class="border-b cursor-pointer hover:bg-blue-50 transition">
                <td class="px-4 py-2.5 text-gray-700">{{ trunc(item.question, 90) }}</td>
                <td class="px-4 py-2.5 text-gray-400 text-xs">{{ item.insurance_type || '—' }}</td>
                <td class="px-4 py-2.5">
                  <span :class="diffBadge(item.difficulty)">{{ item.difficulty || '—' }}</span>
                </td>
                <td class="px-4 py-2.5 text-gray-400 text-xs hidden md:table-cell">{{ item.question_type || '—' }}</td>
                <td class="px-4 py-2.5 text-gray-300 text-xs hidden md:table-cell">{{ shortMethod(item.generation_method) }}</td>
              </tr>
              <!-- Expanded row -->
              <tr v-if="expanded === i">
                <td colspan="5" class="px-6 py-4 bg-blue-50 border-b">
                  <p class="font-medium text-blue-800 mb-2">{{ item.question }}</p>
                  <p class="text-gray-700 whitespace-pre-wrap leading-relaxed mb-3">{{ item.answer }}</p>
                  <div v-if="item.tags && item.tags.length" class="flex flex-wrap gap-1 mb-2">
                    <span v-for="t in item.tags" :key="t"
                          class="px-2 py-0.5 bg-blue-100 text-blue-700 rounded text-xs">{{ t }}</span>
                  </div>
                  <div class="text-xs text-gray-400">
                    来源文档: {{ item.source_doc || '—' }} &nbsp;·&nbsp;
                    批次: {{ item.batch_id || '—' }} &nbsp;·&nbsp;
                    方式: {{ item.generation_method || '—' }}
                  </div>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
        <div v-if="loading" class="text-center py-8 text-gray-400">加载中…</div>
        <div v-if="!loading && !result.items.length" class="text-center py-10 text-gray-400">无数据</div>
      </div>

      <!-- Pagination -->
      <div class="flex items-center gap-1.5 text-xs flex-wrap">
        <button @click="loadPage(1)" :disabled="result.page<=1"
                class="px-2 py-1.5 border rounded disabled:opacity-30 hover:bg-gray-50 transition">«</button>
        <button @click="loadPage(result.page-1)" :disabled="result.page<=1"
                class="px-3 py-1.5 border rounded disabled:opacity-30 hover:bg-gray-50 transition">‹ 上一页</button>
        <span class="px-2 text-gray-500">
          第
          <input type="number" v-model.number="jumpTo" @keyup.enter="loadPage(jumpTo)"
                 class="w-12 border rounded px-1 py-0.5 text-center mx-1" :min="1" :max="result.pages" />
          / {{ result.pages }} 页
        </span>
        <button @click="loadPage(result.page+1)" :disabled="result.page>=result.pages"
                class="px-3 py-1.5 border rounded disabled:opacity-30 hover:bg-gray-50 transition">下一页 ›</button>
        <button @click="loadPage(result.pages)" :disabled="result.page>=result.pages"
                class="px-2 py-1.5 border rounded disabled:opacity-30 hover:bg-gray-50 transition">»</button>
      </div>
    </div>
  `,
  setup() {
    const filters = reactive({ status: 'passed', insurance_type: '', difficulty: '', question_type: '', generation_method: '' });
    const searchText = ref('');
    const pageSize   = ref(20);
    const jumpTo     = ref(1);
    const expanded   = ref(null);
    const loading    = ref(false);
    const filterOpts = ref({ insurance_type: [], difficulty: [], question_type: [], generation_method: [] });
    const result     = reactive({ items: [], total: 0, page: 1, size: 20, pages: 1 });

    async function loadFilterOpts() {
      const r = await fetch('/api/data/qa/filters');
      const d = await r.json();
      filterOpts.value = {
        insurance_type:    d.insurance_types,
        difficulty:        d.difficulties,
        question_type:     d.question_types,
        generation_method: d.generation_methods,
      };
    }

    async function loadPage(page = 1) {
      loading.value = true; expanded.value = null;
      const p = new URLSearchParams({
        page, size: pageSize.value,
        status:            filters.status,
        insurance_type:    filters.insurance_type,
        difficulty:        filters.difficulty,
        question_type:     filters.question_type,
        generation_method: filters.generation_method,
        search:            searchText.value,
      });
      const r = await fetch('/api/data/qa?' + p);
      Object.assign(result, await r.json());
      jumpTo.value  = result.page;
      loading.value = false;
    }

    function toggle(i)  { expanded.value = expanded.value === i ? null : i; }
    function trunc(s, n) { return s && s.length > n ? s.slice(0, n) + '…' : (s || ''); }
    function reset() {
      Object.assign(filters, { status: 'passed', insurance_type: '', difficulty: '', question_type: '', generation_method: '' });
      searchText.value = ''; loadPage(1);
    }
    function diffBadge(d) {
      return {
        '入门': 'px-1.5 py-0.5 rounded text-xs bg-green-50 text-green-600',
        '进阶': 'px-1.5 py-0.5 rounded text-xs bg-yellow-50 text-yellow-600',
        '专业': 'px-1.5 py-0.5 rounded text-xs bg-red-50 text-red-600',
      }[d] || 'text-xs text-gray-400';
    }
    function filterLabel(k) {
      return { insurance_type: '险种', difficulty: '难度', question_type: '问题类型', generation_method: '生成方式' }[k] || k;
    }
    function shortMethod(m) {
      return { seed_from_document: '种子', rephrase: '改述', followup: '追问' }[m] || (m || '—');
    }

    onMounted(() => { loadFilterOpts(); loadPage(1); });
    return { filters, searchText, pageSize, jumpTo, expanded, loading, filterOpts, result, loadPage, toggle, trunc, reset, diffBadge, filterLabel, shortMethod };
  },
};

                <div><span class="font-medium">格式校验</span>：必填字段、长度范围（问题 8–500字，答案 20–2000字）、拒答检测</div>
              </div>
              <div class="flex gap-2">
                <span class="w-5 h-5 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center font-bold flex-shrink-0">2</span>
                <div><span class="font-medium">兜底去重（增量）</span>：以历史已通过数据为基准，新条目只与基准 + 本批内部比对（embedding 或 n-gram），捕获扩展阶段引入的新重复，不对历史数据重跑</div>
              </div>
              <div class="flex gap-2">
                <span class="w-5 h-5 rounded-full bg-yellow-100 text-yellow-700 flex items-center justify-center font-bold flex-shrink-0">3</span>
                <div><span class="font-medium">事实校验</span>：规则引擎核查交强险限额、等待期天数、犹豫期等已知事实</div>
              </div>
              <div class="flex gap-2">
                <span class="w-5 h-5 rounded-full bg-purple-100 text-purple-700 flex items-center justify-center font-bold flex-shrink-0">4</span>
                <div><span class="font-medium">覆盖率分析</span>：统计险种 × 问题类型的覆盖矩阵，识别空白和薄弱区域</div>
              </div>
            </div>
          </div>
          <div>
            <div class="font-medium text-gray-700 mb-1.5">输出文件</div>
            <ul class="space-y-1 text-gray-600">
              <li>• <code class="bg-gray-100 px-1 rounded">qa_passed.jsonl</code> — 历次通过质检的 Q&A（追加写入）</li>
              <li>• <code class="bg-gray-100 px-1 rounded">qa_rejected.jsonl</code> — 被拒绝的（含原因，追加写入）</li>
              <li>• <code class="bg-gray-100 px-1 rounded">qc_manifest.json</code> — 已质检文件清单（filepath → mtime）</li>
              <li>• <code class="bg-gray-100 px-1 rounded">qc_report.json</code> — 各阶段统计报告</li>
            </ul>
            <div class="font-medium text-gray-700 mt-3 mb-1.5">断点续传（真增量）</div>
            <ul class="space-y-1 text-gray-600">
              <li>• <code class="bg-gray-100 px-1 rounded">qc_manifest.json</code> 按文件 mtime 判断，未变化文件直接跳过</li>
              <li>• <strong>格式校验 / 事实校验</strong>：只对新增文件的条目运行，历史通过数据不重复处理</li>
              <li>• <strong>兜底去重</strong>：加载 <code class="bg-gray-100 px-1 rounded">qa_passed.jsonl</code> 作为基准，新条目只需与历史 + 本批已通过的条目比对，无需对全量数据重跑 embedding</li>
              <li>• 新通过的条目<strong>追加</strong>写入 <code class="bg-gray-100 px-1 rounded">qa_passed.jsonl</code>，历史结果永久保留</li>
            </ul>
            <div class="mt-3 bg-green-50 rounded-lg p-2.5 text-gray-600">
              <span class="font-medium">当前数据：</span>
              <span v-if="stats.qc">
                本次新增 {{ (stats.qc.new_input || 0).toLocaleString() }} 条 →
                本次通过 <strong>{{ (stats.qc.passed_new || stats.qc.passed_total || 0).toLocaleString() }}</strong> 条 ·
                累计通过 <strong class="text-green-700">{{ stats.qc.passed_total.toLocaleString() }}</strong> 条
                （通过率 {{ stats.qc.pass_rate }}）
              </span>
              <span v-else class="text-gray-400">加载中…</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 数据流汇总 -->
      <div class="bg-white border rounded-xl overflow-hidden">
        <div class="bg-gray-50 border-b px-4 py-2.5">
          <span class="font-semibold text-gray-700">数据量流转示意</span>
        </div>
        <div class="px-4 py-3">
          <div class="flex items-center gap-2 text-xs overflow-x-auto pb-1">
            <div v-for="(node, i) in dataFlow" :key="i" class="flex items-center gap-2 flex-shrink-0">
              <div class="text-center">
                <div :class="['text-lg font-bold', node.color]">{{ node.count }}</div>
                <div class="text-gray-500 text-xs">{{ node.label }}</div>
              </div>
              <div v-if="i < dataFlow.length - 1" class="flex flex-col items-center text-gray-400 flex-shrink-0">
                <span class="text-base">→</span>
                <span class="text-xs">{{ node.op }}</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 技术架构 -->
      <div class="bg-white border rounded-xl overflow-hidden">
        <div class="bg-gray-50 border-b px-4 py-2.5">
          <span class="font-semibold text-gray-700">技术架构</span>
        </div>
        <div class="px-4 py-3 grid grid-cols-3 gap-4 text-xs">
          <div>
            <div class="font-medium text-gray-700 mb-1.5">后端</div>
            <ul class="space-y-1 text-gray-500">
              <li>• FastAPI + uvicorn</li>
              <li>• SSE 实时推送日志</li>
              <li>• asyncio 并发 LLM 调用</li>
              <li>• 后台线程运行 pipeline</li>
            </ul>
          </div>
          <div>
            <div class="font-medium text-gray-700 mb-1.5">LLM</div>
            <ul class="space-y-1 text-gray-500">
              <li>• DeepSeek API（OpenAI 兼容）</li>
              <li>• 种子生成：并发 20</li>
              <li>• 扩展：并发 5</li>
              <li>• 自动重试 + 断点续传</li>
            </ul>
          </div>
          <div>
            <div class="font-medium text-gray-700 mb-1.5">前端</div>
            <ul class="space-y-1 text-gray-500">
              <li>• Vue 3 Composition API（CDN）</li>
              <li>• Tailwind CSS CDN</li>
              <li>• Chart.js 可视化</li>
              <li>• 服务端分页（JSONL 流式读取）</li>
            </ul>
          </div>
        </div>
      </div>

    </div>
  </div>
  `,
  setup() {
    const steps = [
      { key: 'pre',       icon: '📄', title: '文档预处理', subtitle: '分块 + 元数据',    color: 'border-blue-300 bg-blue-50 text-blue-800' },
      { key: 'seed',      icon: '🌱', title: '种子生成',   subtitle: 'LLM 生成 Q&A',    color: 'border-purple-300 bg-purple-50 text-purple-800' },
      { key: 'dedup',     icon: '🧹', title: '种子去重',   subtitle: '前置过滤重复',      color: 'border-teal-300 bg-teal-50 text-teal-800' },
      { key: 'expand',    icon: '📈', title: '批量扩展',   subtitle: '改述 / 追问 / 模板', color: 'border-yellow-300 bg-yellow-50 text-yellow-800' },
      { key: 'qc',        icon: '✅', title: '质量检查',   subtitle: '校验 + 去重',      color: 'border-green-300 bg-green-50 text-green-800' },
      { key: 'out',       icon: '🎯', title: '知识库入库',  subtitle: '最终 Q&A 数据集',  color: 'border-gray-300 bg-gray-50 text-gray-800' },
    ];
    const templates = [
      { name: '赔付判断', tpl: '{险种}中，{场景}，能赔吗？' },
      { name: '条款解读', tpl: '{险种}里提到"{条款}"，这具体是什么意思？' },
      { name: '时限说明', tpl: '{险种}的{时限}是怎么计算的？超过了怎么办？' },
      { name: '金额计算', tpl: '{险种}约定的{金额}，实际理赔时怎么算？' },
      { name: '操作指引', tpl: '办理{险种}的{流程}需要准备什么？' },
      { name: '除外责任', tpl: '{险种}中"{除外}"属于除外责任吗？' },
    ];
    const crossCount = 19;
    const stats = reactive({ chunks: null, seeds: null, expanded: null, qc: null });

    onMounted(async () => {
      // 从 overview 拿种子数、扩展数、质检报告
      try {
        const r = await fetch('/api/data/reports/overview');
        const d = await r.json();
        stats.seeds    = d.seeds_total    || 0;
        stats.expanded = d.expanded_total || 0;
        stats.qc       = d.qc || null;
      } catch {}
      // chunk 统计：直接读 /chunks/stats，包含总数、文档数、分布
      try {
        const r = await fetch('/api/data/chunks/stats');
        const d = await r.json();
        stats.chunks = {
          total_chunks: d.total_chunks || 0,
          total_docs:   d.total_docs   || '?',
          min:          d.min          || '?',
          max:          d.max          || '?',
          median:       d.median       || '?',
        };
      } catch {}
    });
    const dataFlow = [
      { count: '~50+',  label: '原始文档',   color: 'text-blue-600',   op: '分块' },
      { count: '~800',  label: 'Chunks',    color: 'text-blue-500',   op: '×8 LLM' },
      { count: '~5万',  label: '种子 Q&A',  color: 'text-purple-600', op: '×10 扩展' },
      { count: '~50万', label: '扩展 Q&A',  color: 'text-yellow-600', op: '质检过滤' },
      { count: '~15万', label: '通过质检',   color: 'text-green-600',  op: '入库' },
      { count: '~15万', label: '最终数据集', color: 'text-gray-700',   op: '' },
    ];
    return { steps, dataFlow, templates, crossCount, stats };
  },
};

// ─── Root App ─────────────────────────────────────────────────────────────────
const navItems = [
  { key: 'guide',     label: '流程介绍', icon: '📖' },
  { key: 'documents', label: '文档上传', icon: '📁' },
  { key: 'pipeline',  label: '流水线',   icon: '⚙️'  },
  { key: 'chunks',    label: 'Chunks',   icon: '📦' },
  { key: 'qa',        label: 'Q&A 浏览', icon: '💬' },
  { key: 'reports',   label: '数据报告', icon: '📊' },
];
const pages = {
  guide:     PageGuide,
  documents: PageDocuments,
  pipeline:  PagePipeline,
  chunks:    PageChunks,
  qa:        PageQA,
  reports:   PageReports,
};

createApp({
  setup() {
    const currentPage   = ref('guide');
    const pipelineStatus = reactive({ is_running: false, steps: {} });

    let es = null;
    let pollTimer = null;

    async function pollStatus() {
      try {
        const r = await fetch('/api/pipeline/status');
        Object.assign(pipelineStatus, await r.json());
      } catch {}
    }

    function connectSSE() {
      if (es) es.close();
      es = new EventSource('/api/pipeline/events');
      es.onmessage = (e) => {
        const ev = JSON.parse(e.data);
        if (ev.type === 'init') Object.assign(pipelineStatus, ev.state);
        else if (ev.type === 'step_update') pipelineStatus.is_running = true;
        else if (ev.type === 'pipeline_done') Object.assign(pipelineStatus, ev.state);
      };
      es.onerror = () => setTimeout(connectSSE, 5000);
    }

    onMounted(() => {
      connectSSE();
      pollStatus();
      pollTimer = setInterval(pollStatus, 5000);
    });
    onUnmounted(() => {
      if (es) es.close();
      clearInterval(pollTimer);
    });

    return { currentPage, navItems, pages, pipelineStatus };
  },
  template: `
    <div>
      <header class="bg-white border-b px-6 py-3 flex items-center justify-between sticky top-0 z-20 shadow-sm">
        <span class="text-blue-600 font-bold text-base">⚡ Insurance QA Pipeline</span>
        <div class="flex items-center gap-2 text-xs text-gray-500">
          <span v-if="pipelineStatus.is_running"
                class="inline-block w-3 h-3 border-2 border-blue-400 border-t-transparent rounded-full animate-spin"></span>
          <span v-else class="inline-block w-2.5 h-2.5 rounded-full bg-green-400"></span>
          {{ pipelineStatus.is_running ? '运行中…' : '就绪' }}
        </div>
      </header>
      <div class="flex min-h-screen">
        <nav class="w-44 bg-white border-r pt-4 px-2 flex flex-col gap-0.5 flex-shrink-0">
          <button v-for="item in navItems" :key="item.key"
                  @click="currentPage = item.key"
                  :class="['w-full text-left px-3 py-2 rounded-lg text-sm font-medium transition-colors',
                           currentPage === item.key ? 'bg-blue-50 text-blue-700' : 'text-gray-600 hover:bg-gray-100']">
            <span class="mr-1.5">{{ item.icon }}</span>{{ item.label }}
          </button>
        </nav>
        <main class="flex-1 p-6 overflow-auto min-w-0">
          <component :is="pages[currentPage]" :pipeline-status="pipelineStatus" />
        </main>
      </div>
    </div>
  `,
}).mount('#app');
</script>
</body>
</html>
