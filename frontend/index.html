<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Insurance QA Pipeline</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    [v-cloak] { display: none; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    #sidebar {
      position: fixed;
      top: 49px; /* header height */
      left: 0;
      width: 11rem; /* w-44 */
      bottom: 0;
      overflow-y: auto;
      z-index: 10;
    }
    #main-content {
      margin-left: 11rem;
      margin-top: 49px;
      height: calc(100vh - 49px);
      overflow-y: auto;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 text-sm">

<div id="app" v-cloak>
  <!-- Header -->
  <header class="bg-white border-b px-6 py-3 flex items-center justify-between sticky top-0 z-20 shadow-sm">
    <div class="flex items-center gap-3">
      <span class="text-blue-600 font-bold text-base">⚡ Insurance QA Pipeline</span>
    </div>
    <div class="flex items-center gap-2 text-xs text-gray-500">
      <span v-if="pipelineStatus.is_running"
            class="inline-block w-3 h-3 border-2 border-blue-400 border-t-transparent rounded-full animate-spin"></span>
      <span v-else class="inline-block w-2.5 h-2.5 rounded-full bg-green-400"></span>
      {{ pipelineStatus.is_running ? '运行中…' : '就绪' }}
    </div>
  </header>

  <!-- Sidebar: position fixed, always visible -->
  <nav id="sidebar" class="bg-white border-r pt-4 px-2 flex flex-col gap-0.5">
    <button v-for="item in navItems" :key="item.key"
            @click="currentPage = item.key"
            :class="['w-full text-left px-3 py-2 rounded-lg font-medium transition-colors',
                     currentPage === item.key
                       ? 'bg-blue-50 text-blue-700'
                       : 'text-gray-600 hover:bg-gray-100']">
      <span class="mr-1.5">{{ item.icon }}</span>{{ item.label }}
    </button>
  </nav>

  <!-- Main: scrollable, offset by sidebar width -->
  <main id="main-content" class="p-6">
    <component :is="pages[currentPage]" :pipeline-status="pipelineStatus" />
  </main>
</div>

<script>
const { createApp, ref, reactive, onMounted, onUnmounted, nextTick, computed, watch } = Vue;

// ─── API helpers ─────────────────────────────────────────────────────────────
const API_BASE_CANDIDATES = (() => {
  const list = [];
  if (window.location.origin && window.location.origin !== 'null') {
    list.push(window.location.origin);
  }
  const host = window.location.hostname || '127.0.0.1';
  list.push(`http://${host}:8000`);
  if (host !== '127.0.0.1') list.push('http://127.0.0.1:8000');
  if (host !== 'localhost') list.push('http://localhost:8000');
  return [...new Set(list)];
})();

let resolvedApiBase = null;

async function apiFetch(path, options) {
  const candidates = resolvedApiBase ? [resolvedApiBase, ...API_BASE_CANDIDATES] : API_BASE_CANDIDATES;
  let lastError = null;
  let lastResponse = null;

  for (const base of [...new Set(candidates)]) {
    try {
      const res = await fetch(base + path, options);
      if (!res.ok) {
        lastResponse = res;
        lastError = new Error(`HTTP ${res.status} @ ${base}${path}`);
        continue;
      }

      const contentType = (res.headers.get('content-type') || '').toLowerCase();
      const isExpectedApiResponse =
        contentType.includes('application/json') ||
        contentType.includes('application/problem+json') ||
        contentType.includes('text/event-stream');

      // Some static/dev servers return index.html for /api/* with HTTP 200.
      // Treat HTML as a failed probe and keep trying other API base candidates.
      if (!isExpectedApiResponse) {
        lastResponse = res;
        lastError = new Error(`Unexpected content-type ${contentType || '(empty)'} @ ${base}${path}`);
        continue;
      }

      resolvedApiBase = base;
      return res;
    } catch (err) {
      lastError = err;
    }
  }
  if (lastResponse) return lastResponse;
  throw lastError || new Error(`API request failed: ${path}`);
}

function apiUrl(path) {
  const base = resolvedApiBase || API_BASE_CANDIDATES[0] || '';
  return base + path;
}

// ─── Page: Documents ──────────────────────────────────────────────────────────
const PageDocuments = {
  template: `
    <div>
      <h2 class="text-base font-semibold mb-3">文档管理</h2>

      <!-- Upload zone -->
      <div @dragover.prevent="uploadHover=true" @dragleave="uploadHover=false"
           @drop.prevent="onFileDrop" @click="$refs.fi.click()"
           :class="['border-2 border-dashed rounded-xl p-5 text-center cursor-pointer transition mb-3',
                    uploadHover ? 'border-blue-400 bg-blue-50' : 'border-blue-200 hover:border-blue-300 hover:bg-blue-50/50']">
        <div class="text-2xl mb-1">📄</div>
        <p class="text-blue-500 font-medium text-sm">点击或拖拽文件上传</p>
        <p class="text-gray-400 text-xs mt-0.5">上传至：
          <span class="font-medium text-blue-600">{{ activeFolder ? activeFolder + '/' : '根目录 /' }}</span>
          <span class="text-gray-300 ml-1">（点击树中文件夹图标可切换）</span>
        </p>
        <p class="text-gray-300 text-xs">支持 PDF / DOCX / TXT / MD</p>
        <input ref="fi" type="file" multiple accept=".pdf,.docx,.doc,.txt,.md" class="hidden" @change="onSelect" />
      </div>

      <div v-if="uploading" class="mb-2 flex items-center gap-2 text-blue-500 text-xs">
        <span class="w-3 h-3 border-2 border-blue-400 border-t-transparent rounded-full animate-spin"></span>上传中…
      </div>

      <!-- Toolbar -->
      <div class="flex gap-2 mb-3">
        <input v-model="search" @input="onSearchInput" @keyup.enter="loadTree"
               placeholder="搜索文件名…" class="border rounded px-3 py-1.5 text-xs flex-1" />
        <button v-if="search" @click="search='';loadTree()"
                class="px-2 py-1.5 border rounded text-xs text-gray-400 hover:bg-gray-50">✕</button>
        <button @click="beginNewFolder('')"
                class="px-3 py-1.5 bg-green-600 text-white rounded text-xs hover:bg-green-700 transition">＋ 新建文件夹</button>
      </div>

      <!-- Tree panel -->
      <div class="bg-white border rounded-xl overflow-hidden select-none">

        <!-- Root drop-zone header -->
        <div @dragover.prevent="dragTarget='__root__'" @dragleave="dragTarget=null"
             @drop.prevent="dropOnFolder('')"
             :class="['flex items-center gap-1.5 px-3 py-2 text-xs border-b transition',
                      dragTarget==='__root__' ? 'bg-blue-50 border-blue-300' : 'bg-gray-50']">
          <span class="text-gray-400">📂</span>
          <span class="text-gray-500 font-medium">根目录 /</span>
          <span v-if="dragTarget==='__root__'" class="text-blue-500 ml-1">松开以移动到此处</span>
          <span class="ml-auto text-gray-400">{{ totalFiles }} 个文件</span>
        </div>

        <!-- New folder input at root level -->
        <div v-if="newFolderParent==='' && newFolderVisible"
             class="flex items-center gap-2 px-3 py-1.5 bg-green-50 border-b">
          <span>📁</span>
          <input ref="nfi" v-model="newFolderName" @keyup.enter="confirmNewFolder" @keyup.esc="cancelNewFolder"
                 class="border rounded px-2 py-0.5 text-xs flex-1" placeholder="新文件夹名…" autofocus />
          <button @click="confirmNewFolder" class="text-green-600 text-xs px-1 hover:text-green-800">✓ 确认</button>
          <button @click="cancelNewFolder" class="text-gray-400 text-xs px-1 hover:text-gray-600">✗</button>
        </div>

        <div v-if="loading" class="py-10 text-center text-gray-400 text-sm">加载中…</div>
        <div v-else-if="!flatNodes.length" class="py-10 text-center text-gray-400 text-sm">
          {{ search ? '无匹配文件' : '暂无文档，请上传文件' }}
        </div>

        <div v-else>
          <template v-for="node in flatNodes" :key="node.path">

            <!-- Folder row -->
            <template v-if="node.type==='folder'">
              <div @dragover.prevent="dragTarget=node.path" @dragleave="dragTarget=null"
                   @drop.prevent="dropOnFolder(node.path)"
                   :class="['flex items-center gap-1.5 border-b text-xs py-1.5 pr-2 transition cursor-pointer',
                            dragTarget===node.path ? 'bg-blue-50' : 'hover:bg-gray-50']"
                   :style="{paddingLeft: (node.depth*16+10)+'px'}">
                <button @click="toggleFolder(node.path)" class="text-gray-400 w-4 flex-shrink-0 hover:text-gray-600">
                  {{ expanded.has(node.path) ? '▾' : '▸' }}
                </button>
                <button @click="setActiveFolder(node.path)"
                        :class="['text-lg leading-none flex-shrink-0', activeFolder===node.path ? 'grayscale-0' : 'grayscale']"
                        title="设为上传目标文件夹">📁</button>
                <span @click="toggleFolder(node.path)" class="font-medium text-gray-700 flex-1">{{ node.name }}/</span>
                <span v-if="dragTarget===node.path" class="text-blue-500 mr-1">拖放至此</span>
                <button @click.stop="beginNewFolder(node.path)"
                        class="text-green-500 hover:text-green-700 px-1" title="在此文件夹下新建子文件夹">＋</button>
                <button @click.stop="delFolder(node.path)"
                        class="text-red-300 hover:text-red-500 px-1" title="删除文件夹（含内容）">🗑</button>
              </div>
              <!-- Inline new-subfolder input -->
              <div v-if="newFolderParent===node.path && newFolderVisible"
                   class="flex items-center gap-2 bg-green-50 border-b py-1.5 pr-2"
                   :style="{paddingLeft: ((node.depth+1)*16+10)+'px'}">
                <span>📁</span>
                <input ref="nfi" v-model="newFolderName" @keyup.enter="confirmNewFolder" @keyup.esc="cancelNewFolder"
                       class="border rounded px-2 py-0.5 text-xs flex-1" placeholder="新文件夹名…" />
                <button @click="confirmNewFolder" class="text-green-600 text-xs px-1 hover:text-green-800">✓</button>
                <button @click="cancelNewFolder" class="text-gray-400 text-xs px-1">✗</button>
              </div>
            </template>

            <!-- File row -->
            <div v-else
                 draggable="true"
                 @dragstart="onDragStart($event, node.path)"
                 @dragend="dragging=null; dragTarget=null"
                 :class="['flex items-center gap-2 border-b text-xs py-1.5 pr-2 transition group',
                          dragging===node.path ? 'opacity-30' : 'hover:bg-gray-50']"
                 :style="{paddingLeft: (node.depth*16+10)+'px'}">
              <span class="text-gray-300 cursor-grab group-hover:text-gray-400 w-4 flex-shrink-0">⠿</span>
              <span class="text-blue-400 flex-shrink-0">📄</span>
              <span class="flex-1 text-gray-700 truncate">
                <span v-if="search" v-html="highlight(node.name, search)"></span>
                <span v-else>{{ node.name }}</span>
              </span>
              <span class="text-gray-300 flex-shrink-0">{{ fmtSize(node.size) }}</span>
              <button @click="del(node.path)"
                      class="text-red-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition flex-shrink-0">删除</button>
            </div>

          </template>
        </div>
      </div>

      <!-- Footer -->
      <div class="flex items-center justify-between mt-3">
        <span class="text-xs text-gray-400">
          共 {{ totalFiles }} 个文件
          <span v-if="search" class="text-blue-500">· 搜索 "{{ search }}"</span>
        </span>
        <button v-if="totalFiles" @click="startPreprocess"
                class="px-4 py-1.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition text-xs font-medium">
          开始预处理 →
        </button>
      </div>
    </div>
  `,
  setup() {
    const treeData   = ref([]);
    const totalFiles = ref(0);
    const loading    = ref(false);
    const uploading  = ref(false);
    const uploadHover = ref(false);
    const search     = ref('');
    const expanded   = reactive(new Set());   // folder paths currently open
    const activeFolder = ref('');             // upload target folder
    const dragging   = ref(null);             // file path being dragged
    const dragTarget = ref(null);             // folder path being hovered
    const newFolderVisible = ref(false);
    const newFolderParent  = ref('');
    const newFolderName    = ref('');
    const nfi = ref(null);                    // new-folder input ref
    let _searchTimer = null;

    // ── Tree helpers ────────────────────────────────────────────────────────
    function _flatten(nodes, depth, result) {
      for (const node of nodes) {
        result.push({ ...node, depth, children: undefined });
        if (node.type === 'folder' && expanded.has(node.path)) {
          _flatten(node.children || [], depth + 1, result);
        }
      }
    }

    const flatNodes = computed(() => {
      const list = [];
      _flatten(treeData.value, 0, list);
      return list;
    });

    function toggleFolder(path) {
      if (expanded.has(path)) expanded.delete(path);
      else expanded.add(path);
    }

    function setActiveFolder(path) {
      activeFolder.value = activeFolder.value === path ? '' : path;
    }

    // ── API calls ───────────────────────────────────────────────────────────
    async function loadTree() {
      loading.value = true;
      const p = new URLSearchParams({ search: search.value });
      const r = await apiFetch('/api/documents/tree?' + p);
      const d = await r.json();
      treeData.value   = d.tree;
      totalFiles.value = d.total;
      // Auto-expand folders when searching
      if (search.value) {
        function collectFolders(nodes) {
          for (const n of nodes) {
            if (n.type === 'folder') { expanded.add(n.path); collectFolders(n.children || []); }
          }
        }
        collectFolders(d.tree);
      }
      loading.value = false;
    }

    function onSearchInput() {
      clearTimeout(_searchTimer);
      _searchTimer = setTimeout(loadTree, 300);
    }

    async function upload(files) {
      uploading.value = true;
      uploadHover.value = false;
      for (const f of files) {
        const form = new FormData();
        form.append('file', f);
        form.append('folder', activeFolder.value);
        await apiFetch('/api/documents/upload', { method: 'POST', body: form });
      }
      uploading.value = false;
      if (activeFolder.value) expanded.add(activeFolder.value);
      loadTree();
    }

    function onFileDrop(e) {
      // Only handle actual file drops (not tree-drag events)
      if (e.dataTransfer.files.length) upload(e.dataTransfer.files);
    }

    function onSelect(e) { upload(e.target.files); }

    async function del(path) {
      if (!confirm('确认删除文件？')) return;
      await apiFetch('/api/documents/' + path, { method: 'DELETE' });
      loadTree();
    }

    async function delFolder(path) {
      if (!confirm(\`确认删除文件夹 "\${path}" 及其所有内容？\`)) return;
      await apiFetch('/api/documents/' + path, { method: 'DELETE' });
      expanded.delete(path);
      if (activeFolder.value === path) activeFolder.value = '';
      loadTree();
    }

    // ── Drag-and-drop (tree) ─────────────────────────────────────────────────
    function onDragStart(e, path) {
      dragging.value = path;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', path);
    }

    async function dropOnFolder(folderPath) {
      dragTarget.value = null;
      const src = dragging.value;
      if (!src) return;
      dragging.value = null;
      const srcFolder = src.includes('/') ? src.substring(0, src.lastIndexOf('/')) : '';
      if (srcFolder === folderPath) return;           // no-op: same folder
      try {
        const r = await apiFetch('/api/documents/move', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ src, dest_folder: folderPath }),
        });
        const d = await r.json();
        if (d.moved !== false) {
          if (folderPath) expanded.add(folderPath);
          loadTree();
        }
      } catch(err) {
        alert('移动失败: ' + err.message);
      }
    }

    // ── New folder ───────────────────────────────────────────────────────────
    function beginNewFolder(parentPath) {
      newFolderParent.value  = parentPath;
      newFolderName.value    = '';
      newFolderVisible.value = true;
      if (parentPath) expanded.add(parentPath);
      nextTick(() => { if (nfi.value) (Array.isArray(nfi.value) ? nfi.value[0] : nfi.value)?.focus(); });
    }

    async function confirmNewFolder() {
      const name = newFolderName.value.trim();
      if (!name) return;
      const fullPath = newFolderParent.value ? newFolderParent.value + '/' + name : name;
      await apiFetch('/api/documents/mkdir', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path: fullPath }),
      });
      expanded.add(fullPath);
      cancelNewFolder();
      loadTree();
    }

    function cancelNewFolder() {
      newFolderVisible.value = false;
      newFolderName.value    = '';
    }

    // ── Misc ─────────────────────────────────────────────────────────────────
    async function startPreprocess() {
      await apiFetch('/api/pipeline/start', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ step: 'preprocess' }),
      });
      alert('预处理已启动，请前往「流水线」页面查看进度');
    }

    function fmtSize(b) {
      if (b < 1024) return b + ' B';
      if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
      return (b / 1048576).toFixed(1) + ' MB';
    }

    function highlight(text, kw) {
      if (!kw) return text;
      const esc = kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return text.replace(new RegExp('(' + esc + ')', 'gi'),
        '<mark class="bg-yellow-200 rounded px-0.5">$1</mark>');
    }

    onMounted(loadTree);
    return {
      treeData, flatNodes, totalFiles, loading, uploading, uploadHover,
      search, expanded, activeFolder, dragging, dragTarget,
      newFolderVisible, newFolderParent, newFolderName, nfi,
      loadTree, onSearchInput, toggleFolder, setActiveFolder,
      onFileDrop, onSelect, del, delFolder,
      onDragStart, dropOnFolder,
      beginNewFolder, confirmNewFolder, cancelNewFolder,
      startPreprocess, fmtSize, highlight,
    };
  },
};

// ─── Page: Pipeline ───────────────────────────────────────────────────────────
const PagePipeline = {
  props: ['pipelineStatus'],
  template: `
    <div>
      <h2 class="text-base font-semibold mb-5">流水线控制</h2>

      <!-- Step cards -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div v-for="(step, key) in localStatus.steps" :key="key"
             class="bg-white border rounded-xl p-4 shadow-sm">
          <div class="flex items-center gap-2 mb-2">
            <span :class="dotClass(step.status)"></span>
            <span class="font-medium">{{ step.label }}</span>
          </div>
          <div class="text-xs text-gray-400 mb-2">{{ statusText(step.status) }}</div>
          <div v-if="step.status === 'running'" class="h-1 rounded bg-gray-100 overflow-hidden">
            <div class="h-1 bg-blue-500 rounded transition-all duration-500"
                 :style="{ width: (step.progress || 0) + '%' }"></div>
          </div>
          <div v-if="step.status === 'running' && step.progress > 0"
               class="text-xs text-blue-500 mt-1">{{ step.progress }}%</div>
          <div v-if="step.output_count" class="text-xs text-green-600 mt-1">
            输出 {{ step.output_count.toLocaleString() }} 条
          </div>
          <div v-if="step.error" class="text-xs text-red-400 mt-1 truncate" :title="step.error">
            {{ step.error }}
          </div>
        </div>
      </div>

      <!-- Control buttons -->
      <div class="flex flex-wrap gap-2 mb-5 items-center">
        <template v-if="localStatus.is_running">
          <button @click="stop"
                  class="px-4 py-1.5 bg-red-500 text-white rounded-lg hover:bg-red-600 transition font-medium flex items-center gap-1.5">
            <span>⏹</span> 停止
          </button>
          <span class="text-xs text-red-400">当前步骤完成后将停止</span>
        </template>
        <template v-else>
          <button @click="start('all')"
                  class="px-4 py-1.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-medium">
            ▶ 全流程
          </button>
          <button v-for="s in ['preprocess','seed','seed_dedup','expand','qc']" :key="s"
                  @click="start(s)"
                  :class="['px-3 py-1.5 border rounded-lg transition',
                           s === 'seed_dedup'
                             ? 'bg-teal-50 border-teal-300 text-teal-700 hover:bg-teal-100'
                             : 'bg-white border-gray-300 text-gray-600 hover:bg-gray-50']">
            {{ stepLabel(s) }}
          </button>
        </template>
      </div>

      <!-- Log console -->
      <div class="bg-gray-900 rounded-xl px-4 py-3 font-mono text-xs text-green-300 h-64 overflow-y-auto" ref="logEl">
        <div v-if="!logs.length" class="text-gray-600">等待日志输出…</div>
        <div v-for="(line, i) in logs" :key="i"
             :class="line.level === 'ERROR' ? 'text-red-400' : line.level === 'WARNING' ? 'text-yellow-300' : ''">
          {{ line.message }}
        </div>
      </div>
    </div>
  `,
  setup(props) {
    const logs = ref([]);
    const logEl = ref(null);
    const localStatus = reactive({ is_running: false, steps: {} });
    let es = null;

    function syncStatus(state) {
      if (state) Object.assign(localStatus, state);
    }

    function connect() {
      if (es) es.close();
      es = new EventSource(apiUrl('/api/pipeline/events'));
      es.onmessage = (e) => {
        const ev = JSON.parse(e.data);
        if (ev.type === 'init') syncStatus(ev.state);
        else if (ev.type === 'step_update') {
          if (localStatus.steps[ev.step]) Object.assign(localStatus.steps[ev.step], ev);
        } else if (ev.type === 'pipeline_done') {
          syncStatus(ev.state);
        } else if (ev.type === 'log') {
          logs.value.push(ev);
          if (logs.value.length > 300) logs.value.shift();
          nextTick(() => { if (logEl.value) logEl.value.scrollTop = logEl.value.scrollHeight; });
        }
      };
      es.onerror = () => setTimeout(connect, 3000);
    }

    watch(() => props.pipelineStatus, (v) => syncStatus(v), { deep: true });

    async function start(step) {
      logs.value = [];
      const r = await apiFetch('/api/pipeline/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ step }),
      });
      if (!r.ok) {
        const d = await r.json();
        alert(d.detail || '启动失败');
      }
    }

    function dotClass(s) {
      return {
        idle:    'w-2 h-2 rounded-full bg-gray-300',
        running: 'w-2 h-2 rounded-full bg-blue-500 animate-pulse',
        done:    'w-2 h-2 rounded-full bg-green-500',
        error:   'w-2 h-2 rounded-full bg-red-500',
        stopped: 'w-2 h-2 rounded-full bg-yellow-500',
      }[s] || 'w-2 h-2 rounded-full bg-gray-300';
    }
    function statusText(s) {
      return { idle: '待运行', running: '运行中…', done: '已完成', error: '出错', stopped: '已停止' }[s] || s;
    }
    function stepLabel(s) {
      return { preprocess: '预处理', seed: '种子生成', seed_dedup: '种子去重', expand: '批量扩展', qc: '质检' }[s] || s;
    }

    async function stop() {
      const r = await apiFetch('/api/pipeline/stop', { method: 'POST' });
      if (!r.ok) {
        const d = await r.json();
        alert(d.detail || '停止失败');
      }
    }

    onMounted(connect);
    onUnmounted(() => { if (es) es.close(); });
    return { logs, logEl, localStatus, start, stop, dotClass, statusText, stepLabel };
  },
};

  setup() {
    const currentPage   = ref('documents');
    const pipelineStatus = reactive({ is_running: false, steps: {} });

    let es = null;
    let pollTimer = null;

    async function pollStatus() {
      try {
        const r = await apiFetch('/api/pipeline/status');
        Object.assign(pipelineStatus, await r.json());
      } catch {}
    }

    function connectSSE() {
      if (es) es.close();
      es = new EventSource(apiUrl('/api/pipeline/events'));
      es.onmessage = (e) => {
        const ev = JSON.parse(e.data);
        if (ev.type === 'init') Object.assign(pipelineStatus, ev.state);
        else if (ev.type === 'step_update') pipelineStatus.is_running = true;
        else if (ev.type === 'pipeline_done') Object.assign(pipelineStatus, ev.state);
      };
      es.onerror = () => setTimeout(connectSSE, 5000);
    }

    onMounted(() => {
      connectSSE();
      pollStatus();
      pollTimer = setInterval(pollStatus, 5000);
    });
    onUnmounted(() => {
      if (es) es.close();
      clearInterval(pollTimer);
    });

    return { currentPage, navItems, pages, pipelineStatus };
  },

                  @click="currentPage = item.key"
                  :class="['w-full text-left px-3 py-2 rounded-lg text-sm font-medium transition-colors',
                           currentPage === item.key ? 'bg-blue-50 text-blue-700' : 'text-gray-600 hover:bg-gray-100']">
            <span class="mr-1.5">{{ item.icon }}</span>{{ item.label }}
          </button>
        </nav>
        <main class="flex-1 p-6 overflow-auto min-w-0">
          <component :is="pages[currentPage]" :pipeline-status="pipelineStatus" />
        </main>
      </div>
    </div>
  `,
}).mount('#app');
</script>
</body>
</html>
